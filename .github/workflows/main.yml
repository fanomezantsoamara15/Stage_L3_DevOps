name: CI/CD Pipeline for Quiz Connect App

on:
  push:
    branches:
      - main
      - test-CI
  workflow_dispatch:

env:
  BACKEND_IMAGE: delph152/quiz-connect-backend
  FRONTEND_IMAGE: delph152/quiz-connect-frontend

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:latest -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -f backend/Dockerfile .
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }}:latest -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ./quiz-connect-forge
          docker push ${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build_and_push
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to local Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/
          kubectl -n quiz-connect rollout restart deployment/backend deployment/frontend
          kubectl -n quiz-connect rollout status deployment/backend --timeout=180s
          kubectl -n quiz-connect rollout status deployment/frontend --timeout=180s
